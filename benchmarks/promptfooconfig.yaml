description: "Ponytail UE5.5 vs terse-prose control vs no skill: structural correctness and code LOC."

providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config: { max_tokens: 8192, temperature: 1 }
  - id: anthropic:messages:claude-sonnet-4-6
    config: { max_tokens: 8192, temperature: 1 }
  - id: anthropic:messages:claude-opus-4-8
    config: { max_tokens: 8192, temperature: 1 }

prompts:
  - id: file://arms/baseline.js
    label: baseline (no skill)
  - id: file://arms/caveman.js
    label: terse-prose control
  - id: file://arms/ponytail.js
    label: ponytail UE5.5

defaultTest:
  assert:
    - type: javascript
      value: file://loc.js
      metric: code_loc
    - type: javascript
      value: file://correctness.js
      metric: correct

tests:
  - vars: { task: "In Unreal Engine 5.5 C++, make an Actor respawn once after 5 seconds. It currently has Tick disabled." }
  - vars: { task: "Implement server-authoritative replicated health in Unreal Engine 5.5 C++ so remote clients and late joiners receive state." }
  - vars: { task: "In UE5.5 C++, reference an optional skin that should remain unloaded until selected, then load it safely." }
  - vars: { task: "A private cpp file needs TargetModule in this UE5.5 module. Show the smallest correct Build.cs dependency change." }
  - vars: { task: "Batch rename Unreal Engine 5.5 assets while preserving references. Give the supported minimal editor automation path." }
