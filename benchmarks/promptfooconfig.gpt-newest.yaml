description: "Ponytail UE5.3 vs baseline on newer OpenAI models: structural correctness and code LOC."

providers:
  - id: openai:gpt-5.5
    config: { max_completion_tokens: 8192 }
  - id: openai:gpt-4.1-mini
    config: { max_tokens: 8192, temperature: 1 }
  - id: openai:gpt-5.4-mini
    config: { max_completion_tokens: 8192 }

prompts:
  - id: file://arms/baseline.js
    label: baseline (no skill)
  - id: file://arms/ponytail.js
    label: ponytail UE5.3

defaultTest:
  assert:
    - type: javascript
      value: file://loc.js
      metric: code_loc
    - type: javascript
      value: file://correctness.js
      metric: correct

tests:
  - vars: { task: "In Unreal Engine 5.3 C++, make an Actor respawn once after 5 seconds. It currently has Tick disabled." }
  - vars: { task: "Implement server-authoritative replicated health in Unreal Engine 5.3 C++ so remote clients and late joiners receive state." }
  - vars: { task: "In UE5.3 C++, reference an optional skin that should remain unloaded until selected, then load it safely." }
  - vars: { task: "A private cpp file needs TargetModule in this UE5.3 module. Show the smallest correct Build.cs dependency change." }
  - vars: { task: "Batch rename Unreal Engine 5.3 assets while preserving references. Give the supported minimal editor automation path." }
