description = "Review a UE5.7 diff for removable architecture and engine duplication"
prompt = "Review the current UE5.7 diff for over-engineering only. Inspect the .uproject, affected modules, Blueprint/C++ boundary, and reference flow. One line per finding: <file>:L<line>: <tag> <cut>. <UE/project-native replacement>. Tags: delete, native, tick, layer, reflect, dependency, shrink. Never call an asset dead from grep alone or remove required GC, replication, serialization, cook, redirect, or editor metadata. End with measurable source/reflection/dependency cuts and verified asset deletions. If none: 'Lean for UE5.7 already. Ship.'"
