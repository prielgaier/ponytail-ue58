description = "Audit an entire UE4.27 project for safely removable complexity"
prompt = "Audit the whole UE4.27 project for avoidable Tick, custom managers, one-use Subsystems/Components/interfaces, unnecessary reflection, extra modules/plugins, duplicated engine features, and safely removable code/assets. Skip Binaries, Intermediate, Saved, and DerivedDataCache. Require Asset Registry/Reference Viewer evidence for asset deletion. Preserve UObject, networking, threading, serialization, cook, redirect, and migration boundaries. Rank findings and end with measurable cuts plus items needing editor verification. Report only."
